name: Build Artisan controller

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build controller and bootloader
        run: pio run -e snapmaker_controller2022_boot -e snapmaker_controller2022
